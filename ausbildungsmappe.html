<style>
/* Layout: Ausbildungsordner – nur Register-Reiter zum Auswählen */
:root {
  --bg: #eef1f4;
  --sheet: #ffffff;
  --ink: #18212d;
  --muted: #566274;
  --rule: #d5dbe3;
  --accent: #0f6b5c;
  --reg-a: #c9472f;
  --reg-b: #2a5bb8;
  --reg-c: #b07a10;
  --reg-d: #6b4fa3;
  --f-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d; --sheet: #19202a; --ink: #e7ecf2; --muted: #9ba7b8; --rule: #2c3644;
    --accent: #4fc2ab; --reg-a: #f07c64; --reg-b: #78a2f2; --reg-c: #e2b04a; --reg-d: #ad93e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161d; --sheet: #19202a; --ink: #e7ecf2; --muted: #9ba7b8; --rule: #2c3644;
  --accent: #4fc2ab; --reg-a: #f07c64; --reg-b: #78a2f2; --reg-c: #e2b04a; --reg-d: #ad93e6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 17px/1.4 var(--f-display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 28px; }
h1 {
  font: 700 clamp(30px, 6vw, 44px)/1.05 var(--f-display); margin: 0; letter-spacing: -.02em;
  border-left: 8px solid var(--accent); padding-left: 16px;
}
section { display: grid; gap: 8px; }
h2 { font: 600 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--c); margin: 0 0 2px 2px; }
.r1 { --c: var(--reg-a); } .r2 { --c: var(--reg-b); } .r3 { --c: var(--reg-c); } .r4 { --c: var(--reg-d); }
a {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  text-decoration: none; color: var(--ink); font-weight: 700; font-size: 19px;
  background: var(--sheet); border: 1px solid var(--rule); border-left: 6px solid var(--c);
  border-radius: 4px 10px 10px 4px; padding: 14px 18px; min-width: 0;
}
a::after { content: "↗"; color: var(--c); font-weight: 600; }
a:hover { border-color: var(--c); }
a:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) {
  a { transition: translate .15s ease, border-color .15s ease; }
  a:hover { translate: 4px 0; }
}
</style>
