name: Jarvis für Windows bauen

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/jarvis-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements*.txt

      - name: Pakete installieren
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Jarvis.exe bauen
        run: pyinstaller --noconfirm jarvis.spec

      - name: Selbsttest der fertigen Jarvis.exe
        shell: pwsh
        run: |
          $env:JARVIS_DATA_DIR = "$env:RUNNER_TEMP\jarvis-selftest"
          $p = Start-Process -FilePath "dist\Jarvis\Jarvis.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:JARVIS_DATA_DIR\jarvis_app.log"
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (Exit-Code $($p.ExitCode))" }

      - name: Installer bauen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = python -c "import config; print(config.VERSION)"
          & $iscc "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fehlgeschlagen" }
          Compress-Archive -Path "dist\Jarvis\*" -DestinationPath "dist-installer\Jarvis-portable.zip"
          Get-ChildItem dist-installer

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: desktop/dist-installer/*

      - name: Download-Seite aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          target_commitish: ${{ github.sha }}
          name: Jarvis für Windows (neueste Version)
          prerelease: true
          overwrite_files: true
          files: desktop/dist-installer/*
          body: |
            **Jarvis-Setup.exe** herunterladen, doppelklicken, fertig – keine Python-Installation nötig.

            Windows zeigt beim ersten Start evtl. „Der Computer wurde durch Windows geschützt“
            (das Programm ist nicht digital signiert) → „Weitere Informationen“ → „Trotzdem ausführen“.

            Ohne Installation: **Jarvis-portable.zip** entpacken und `Jarvis.exe` starten.

            Gebaut aus Commit ${{ github.sha }}.
