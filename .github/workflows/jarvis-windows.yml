name: Jarvis für Windows bauen

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/jarvis-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      # Muss eine Version sein, für die python.org ein "embeddable package" anbietet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: desktop/requirements*.txt

      - name: Pakete installieren
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Programmordner mit signiertem Python bauen (inkl. Selbsttest)
        shell: pwsh
        run: ./build_windows.ps1

      - name: Spracherkennung ohne FLAC prüfen
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\probe.wav", $fmt)
          $s.Speak("Please remind me in ten minutes to take out the laundry.")
          $s.Dispose()
          python tools/probe_google_stt.py "$env:RUNNER_TEMP\probe.wav"

      - name: Installer bauen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = python -c "import config; print(config.VERSION)"
          & $iscc /Qp "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fehlgeschlagen" }
          Get-ChildItem dist-installer

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: desktop/dist-installer/*

      - name: Alte Download-Version entfernen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jarvis-latest --yes --cleanup-tag --repo "${{ github.repository }}"
          exit 0

      - name: Download-Seite aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          target_commitish: ${{ github.sha }}
          name: Jarvis für Windows (neueste Version)
          prerelease: true
          files: desktop/dist-installer/Jarvis-Setup.exe
          body: |
            **Jarvis-Setup.exe** herunterladen, doppelklicken, fertig – keine Python-Installation nötig.

            Jarvis startet über das offizielle, signierte Python von python.org und wird daher
            von Windows' Smart App Control nicht blockiert.

            Beim Installer selbst kann Windows „Der Computer wurde durch Windows geschützt“ zeigen
            → „Weitere Informationen“ → „Trotzdem ausführen“.

            Gebaut aus Commit ${{ github.sha }}.
